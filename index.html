<!doctype html>
<html lang="en" class="theme-warmer">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23F7F4EE' stroke='%23FF5500' stroke-width='4'/%3E%3Cpath d='M30 65 L30 35 L50 35 C62 35 68 42 68 50 C68 56 64 61 56 63 L70 80 L56 80 L44 65 Z M42 45 L42 55 L50 55 C55 55 58 53 58 50 C58 47 55 45 50 45 Z' fill='%23FF5500'/%3E%3Cpath d='M72 40 Q82 50 72 60' stroke='%230066FF' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M80 32 Q94 50 80 68' stroke='%230284C7' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5500" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="rext" />
    <link rel="manifest" href="/manifest.json" />
    <title>rext — Music Streaming</title>
    <!-- Preconnect for instant zero-latency YouTube video & audio streaming -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://s.ytimg.com">
    <!-- Fonts: Outfit, Syne, Space Grotesk, Cinzel, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="theme-warmer font-outfit text-[var(--text-main)] selection:bg-[#FF5500] selection:text-white antialiased overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || navigator.userAgent.includes('Electron')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js?v=6').then(function(reg) {
              reg.update();
            }).catch(function(){});
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
